<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteko Zereginak</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --accent: #FFC107;
            --bg: #F4F7F6;
            --card-bg: #FFFFFF;
            --text: #333333;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .hidden { display: none !important; }

        /* --- PANTALLA SELECCIÓN PERFIL --- */
        .profile-selector {
            text-align: center;
            padding: 20px 0;
        }
        .profile-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .profile-card {
            background: #f8f9fa;
            border: 3px solid #e9ecef;
            border-radius: 20px;
            padding: 15px;
            width: 140px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .profile-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .profile-card img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        /* --- CABECERA Y NAVEGACIÓN --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e9ecef;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        /* --- ESTILO VISUAL ANTERIOR DE TAREAS (DIARIO) --- */
        .day-navigator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8f5e9;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .task-card-visual {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }

        .task-img-container {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f0f0;
        }
        .task-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .task-details {
            flex-grow: 1;
        }
        .task-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .task-badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        /* --- CASILLAS / TICKS ESTILO ANTERIOR --- */
        .checkbox-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .custom-check {
            width: 38px;
            height: 38px;
            border: 3px solid var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            font-weight: bold;
            user-select: none;
            background: #fff;
            transition: all 0.1s ease;
        }
        .custom-check.checked {
            background: var(--primary);
            color: white;
        }

        /* --- VISTA SEMANAL TABLA --- */
        .weekly-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .weekly-table th, .weekly-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .weekly-table th { background: #f2f2f2; }
        .weekly-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }

        /* --- BOTONES Y GENERAL --- */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-admin { background: #6c757d; }
        .btn-danger { background: #dc3545; }
        .btn-sec { background: #e9ecef; color: #333; }

        .progress-bar-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. PANTALLA SELECCIÓN DE PERFIL (ÚNICO LUGAR CON BOTÓN KUDEAKETA) -->
    <div id="view-profile-select" class="profile-selector">
        <h2>Nor zara?</h2>
        <div id="profiles-container" class="profile-list"></div>
        <button class="btn btn-admin" onclick="openAdminModal()">⚙️ Kudeaketa (Admin)</button>
    </div>

    <!-- 2. VISTA PRINCIPAL (DIARIA / SEMANAL / SARIAGAK) -->
    <div id="view-main" class="hidden">
        <header>
            <div class="user-info">
                <img id="current-user-avatar" src="" alt="Avatar">
                <div>
                    <h3 id="current-user-name" style="margin:0;"></h3>
                    <small>Puntuak (4 aste): <strong id="user-points">0</strong> PT</small>
                </div>
            </div>
            <button class="btn btn-sec" onclick="logout()">Sartu berriro</button>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('daily')">Egunero</button>
            <button class="tab-btn" onclick="switchTab('weekly')">Astea</button>
            <button class="tab-btn" onclick="switchTab('rewards')">Sariak</button>
        </div>

        <!-- TAB: EGUNERO (Diseño de tarjetas e imágenes recuperado) -->
        <div id="tab-daily">
            <div class="day-navigator">
                <button class="btn btn-sec" onclick="changeDay(-1)">◀</button>
                <span id="current-day-text">Astelehena</span>
                <button class="btn btn-sec" onclick="changeDay(1)">▶</button>
            </div>

            <div class="progress-bar-container">
                <div id="daily-progress" class="progress-bar"></div>
            </div>

            <div id="daily-tasks-list"></div>
        </div>

        <!-- TAB: ASTEA (Tabla semanal previa) -->
        <div id="tab-weekly" class="hidden">
            <table class="weekly-table">
                <thead>
                    <tr>
                        <th>Zeregina</th>
                        <th>Al</th><th>Ar</th><th>Az</th><th>Og</th><th>Or</th><th>La</th><th>Ig</th>
                    </tr>
                </thead>
                <tbody id="weekly-tasks-body"></tbody>
            </table>
        </div>

        <!-- TAB: SARIAK -->
        <div id="tab-rewards" class="hidden">
            <h3>Eskuragarri dauden sariak</h3>
            <div id="rewards-list"></div>
        </div>
    </div>

</div>

<script>
    // --- ESTADO Y DATOS BASE ---
    const DAYS = ['Astelehena', 'Asteartea', 'Asteazkena', 'Oseguna', 'Ostirala', 'Larunbata', 'Igandea'];
    let currentDayIdx = 0;
    let currentUser = null;

    let appData = JSON.parse(localStorage.getItem('asteko_data')) || {
        users: [
            { id: '1', name: 'Luke', avatar: 'https://via.placeholder.com/90/4CAF50/ffffff?text=Luke' },
            { id: '2', name: 'Marty', avatar: 'https://via.placeholder.com/90/FFC107/ffffff?text=Marty' }
        ],
        tasks: [
            { id: 't1', title: 'Ohea egin', img: 'https://via.placeholder.com/90/e0e0e0/888888?text=Ohea', checks: 1, points: 5, userId: '1' },
            { id: 't2', title: 'Mahaia jarri', img: 'https://via.placeholder.com/90/e0e0e0/888888?text=Mahaia', checks: 2, points: 10, userId: '1', team: true }
        ],
        logs: {} // Estructura: logs[userId][taskId][dayIdx] = countChecks
    };

    function saveData() {
        localStorage.setItem('asteko_data', JSON.stringify(appData));
    }

    // --- INICIALIZACIÓN ---
    function init() {
        renderProfileSelection();
        // Obtener el día de la semana actual (0: Astelehena)
        let d = new Date().getDay();
        currentDayIdx = d === 0 ? 6 : d - 1; 
    }

    function renderProfileSelection() {
        const container = document.getElementById('profiles-container');
        container.innerHTML = '';
        appData.users.forEach(u => {
            container.innerHTML += `
                <div class="profile-card" onclick="selectProfile('${u.id}')">
                    <img src="${u.avatar}" alt="${u.name}">
                    <h4>${u.name}</h4>
                </div>
            `;
        });
    }

    function selectProfile(id) {
        currentUser = appData.users.find(u => u.id === id);
        document.getElementById('current-user-avatar').src = currentUser.avatar;
        document.getElementById('current-user-name').innerText = currentUser.name;
        
        document.getElementById('view-profile-select').classList.add('hidden');
        document.getElementById('view-main').classList.remove('hidden');
        
        renderDailyView();
    }

    function logout() {
        currentUser = null;
        document.getElementById('view-main').classList.add('hidden');
        document.getElementById('view-profile-select').classList.remove('hidden');
    }

    // --- NAVEGACIÓN Y VISTAS ---
    function switchTab(tab) {
        document.querySelectorAll('.nav-tabs .tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('tab-daily').classList.add('hidden');
        document.getElementById('tab-weekly').classList.add('hidden');
        document.getElementById('tab-rewards').classList.add('hidden');

        if(tab === 'daily') {
            document.getElementById('tab-daily').classList.remove('hidden');
            renderDailyView();
        } else if(tab === 'weekly') {
            document.getElementById('tab-weekly').classList.remove('hidden');
            renderWeeklyView();
        } else if(tab === 'rewards') {
            document.getElementById('tab-rewards').classList.remove('hidden');
        }
    }

    function changeDay(dir) {
        currentDayIdx = (currentDayIdx + dir + 7) % 7;
        renderDailyView();
    }

    // --- RENDER DÍARIO (CON MOLDES VISUALES ORIGINALES) ---
    function renderDailyView() {
        document.getElementById('current-day-text').innerText = DAYS[currentDayIdx];
        const container = document.getElementById('daily-tasks-list');
        container.innerHTML = '';

        const userTasks = appData.tasks.filter(t => t.userId === currentUser.id);

        userTasks.forEach(task => {
            const currentChecks = getChecks(task.id, currentDayIdx);
            
            let checksHtml = '';
            for(let i = 0; i < task.checks; i++) {
                const isChecked = i < currentChecks;
                checksHtml += `
                    <div class="custom-check ${isChecked ? 'checked' : ''}" 
                         onclick="toggleCheck('${task.id}', ${i})">
                        ${isChecked ? '✓' : ''}
                    </div>
                `;
            }

            container.innerHTML += `
                <div class="task-card-visual">
                    <div class="task-img-container">
                        <img src="${task.img}" alt="${task.title}">
                    </div>
                    <div class="task-details">
                        ${task.team ? '<span class="task-badge">🤝 Elkarrekin</span>' : ''}
                        <div class="task-title">${task.title}</div>
                        <small>+${task.points} PT</small>
                        <div class="checkbox-group">
                            ${checksHtml}
                        </div>
                    </div>
                </div>
            `;
        });

        updateProgress();
    }

    // --- RENDER SEMANAL (ESTILO TABLA) ---
    function renderWeeklyView() {
        const body = document.getElementById('weekly-tasks-body');
        body.innerHTML = '';
        const userTasks = appData.tasks.filter(t => t.userId === currentUser.id);

        userTasks.forEach(task => {
            let rowHtml = `<tr>
                <td style="display:flex; align-items:center; gap:8px;">
                    <img class="weekly-img" src="${task.img}">
                    <span>${task.title}</span>
                </td>`;
            
            for(let d = 0; d < 7; d++) {
                const done = getChecks(task.id, d) >= task.checks;
                rowHtml += `<td>${done ? '✅' : '❌'}</td>`;
            }
            rowHtml += `</tr>`;
            body.innerHTML += rowHtml;
        });
    }

    // --- ACCIONES DE CHECKS Y LOGS ---
    function getChecks(taskId, dayIdx) {
        return appData.logs?.[currentUser.id]?.[taskId]?.[dayIdx] || 0;
    }

    function toggleCheck(taskId, checkIndex) {
        if(!appData.logs[currentUser.id]) appData.logs[currentUser.id] = {};
        if(!appData.logs[currentUser.id][taskId]) appData.logs[currentUser.id][taskId] = {};

        let current = getChecks(taskId, currentDayIdx);
        // Si pulsas la casilla activa, la desmarcas; si no, subes de nivel.
        let updated = (checkIndex + 1 === current) ? checkIndex : checkIndex + 1;
        
        appData.logs[currentUser.id][taskId][currentDayIdx] = updated;
        saveData();
        renderDailyView();
    }

    function updateProgress() {
        const userTasks = appData.tasks.filter(t => t.userId === currentUser.id);
        let total = 0;
        let completed = 0;

        userTasks.forEach(t => {
            total += t.checks;
            completed += getChecks(t.id, currentDayIdx);
        });

        const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
        document.getElementById('daily-progress').style.width = pct + '%';
    }

    function openAdminModal() {
        const pass = prompt("Sartu pasahitza (Admin):");
        if(pass === "1234") {
            alert("Sarbidea baimenduta. Kudeaketa panela zabaltzen...");
            // Aquí se integraría el desplegable/modal completo de administración
        } else if(pass !== null) {
            alert("Pasahitz okerra!");
        }
    }

    // Inicializar al cargar
    init();
</script>
</body>
</html>
