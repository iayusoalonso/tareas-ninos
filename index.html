<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zereginak</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .task-card { transition: all 0.2s ease; }
    .task-card:active { transform: scale(0.98); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Zereginak</h1>
      <p class="text-xs text-indigo-200">Etxeko txandak eta kudeaketa</p>
    </div>
    <div class="flex gap-2">
      <button onclick="toggleAdminModal()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 shadow">
        ⚙️ Kudeaketa
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto p-4 space-y-6">

    <!-- User Selector & Points summary -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <label for="userSelect" class="font-bold text-slate-700 text-sm">Erabiltzailea:</label>
        <select id="userSelect" onchange="changeUser(this.value)" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 p-2.5 flex-1 sm:w-48 font-semibold">
          <!-- Dinámico -->
        </select>
      </div>
      
      <div id="pointsContainer" class="flex gap-3 text-right w-full sm:w-auto justify-end">
        <div class="bg-indigo-50 border border-indigo-100 p-2.5 rounded-xl text-center">
          <span class="block text-xs text-indigo-600 font-semibold uppercase tracking-wider">Puntuak en firme</span>
          <span id="firmPoints" class="text-xl font-black text-indigo-700">0</span>
        </div>
        <div class="bg-amber-50 border border-amber-100 p-2.5 rounded-xl text-center">
          <span class="block text-xs text-amber-600 font-semibold uppercase tracking-wider">Gaur (Zain)</span>
          <span id="pendingPoints" class="text-xl font-black text-amber-600">0</span>
        </div>
      </div>
    </section>

    <!-- Daily Tasks View -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
          <span>📅 Gaurko Zereginak</span>
        </h2>
        <span id="currentDate" class="text-xs font-semibold text-slate-400"></span>
      </div>

      <div id="taskList" class="space-y-2">
        <!-- Renderizado dinámico -->
      </div>
    </section>

  </main>

  <!-- Modal Admin / Kudeaketa -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden">
      
      <div class="p-4 bg-indigo-600 text-white flex justify-between items-center">
        <h3 class="font-bold text-lg">Panel de Kudeaketa</h3>
        <button onclick="toggleAdminModal()" class="text-white hover:bg-indigo-700 p-1 rounded-lg">✕</button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6 flex-1 text-sm">
        
        <!-- Edición diferida admin -->
        <div class="border-b pb-4">
          <h4 class="font-bold text-slate-800 mb-2">Modificar Tareas Completadas (Histórico)</h4>
          <div class="flex gap-2 mb-3">
            <input type="date" id="adminDatePicker" class="border rounded-lg p-2 text-sm" onchange="renderAdminHistoryTasks()">
          </div>
          <div id="adminHistoryList" class="space-y-2 bg-slate-50 p-3 rounded-xl border max-h-40 overflow-y-auto">
            <p class="text-xs text-slate-400">Hautatu data bat zereginak aldatzeko.</p>
          </div>
        </div>

        <!-- Backup -->
        <div class="border-b pb-4">
          <h4 class="font-bold text-slate-800 mb-2">Copia de Seguridad (Backup)</h4>
          <div class="flex gap-2">
            <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-xl text-xs font-semibold">
              📥 Exportar JSON
            </button>
            <label class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-xl text-xs font-semibold cursor-pointer">
              📤 Importar JSON
              <input type="file" id="importInput" accept=".json" class="hidden" onchange="importData(event)">
            </label>
          </div>
        </div>

      </div>

      <div class="p-4 bg-slate-50 border-t flex justify-end">
        <button onclick="toggleAdminModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">Itxi</button>
      </div>

    </div>
  </div>

  <script>
    // Configuración base / inicial
    const DEFAULT_DATA = {
      users: [
        { id: 'u1', name: 'Ane' },
        { id: 'u2', name: 'Jon' }
      ],
      tasks: [
        { id: 't1', title: 'Ohea egin', points: 10 },
        { id: 't2', title: 'Mahai gaina garbitu', points: 15 },
        { id: 't3', title: 'Txakurra atera', points: 20 }
      ],
      // Estructura: logs['YYYY-MM-DD']['userId']['taskId'] = true/false
      logs: {}
    };

    let state = JSON.parse(localStorage.getItem('zereginak_db')) || DEFAULT_DATA;
    let currentUser = state.users[0]?.id || '';

    // Utilidades de Fechas
    const getFormattedDate = (dateObj) => dateObj.toISOString().split('T')[0];
    const todayStr = getFormattedDate(new Date());

    function saveState() {
      localStorage.setItem('zereginak_db', JSON.stringify(state));
      render();
    }

    function init() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      }
      document.getElementById('currentDate').textContent = todayStr;
      document.getElementById('adminDatePicker').value = todayStr;
      
      renderUsers();
      render();
    }

    function renderUsers() {
      const select = document.getElementById('userSelect');
      select.innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
      if (currentUser) select.value = currentUser;
    }

    function changeUser(val) {
      currentUser = val;
      render();
    }

    function calculatePoints(userId) {
      let firmPoints = 0;
      let pendingPoints = 0;

      // Calcular últimos 6 días (excluyendo hoy)
      for (let i = 1; i <= 6; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateKey = getFormattedDate(d);
        
        const dayLogs = state.logs[dateKey]?.[userId] || {};
        Object.keys(dayLogs).forEach(taskId => {
          if (dayLogs[taskId]) {
            const task = state.tasks.find(t => t.id === taskId);
            if (task) firmPoints += task.points;
          }
        });
      }

      // Puntos del día en curso (pendientes)
      const todayLogs = state.logs[todayStr]?.[userId] || {};
      Object.keys(todayLogs).forEach(taskId => {
        if (todayLogs[taskId]) {
          const task = state.tasks.find(t => t.id === taskId);
          if (task) pendingPoints += task.points;
        }
      });

      return { firmPoints, pendingPoints };
    }

    function toggleTask(taskId, dateKey = todayStr) {
      if (!state.logs[dateKey]) state.logs[dateKey] = {};
      if (!state.logs[dateKey][currentUser]) state.logs[dateKey][currentUser] = {};

      state.logs[dateKey][currentUser][taskId] = !state.logs[dateKey][currentUser][taskId];
      saveState();
    }

    function render() {
      // 1. Puntos
      const { firmPoints, pendingPoints } = calculatePoints(currentUser);
      document.getElementById('firmPoints').textContent = firmPoints;
      document.getElementById('pendingPoints').textContent = pendingPoints;

      // 2. Tareas del día (para el usuario actual)
      const container = document.getElementById('taskList');
      const todayUserLogs = state.logs[todayStr]?.[currentUser] || {};

      container.innerHTML = state.tasks.map(task => {
        const isDone = !!todayUserLogs[task.id];
        return `
          <div onclick="toggleTask('${task.id}')" class="task-card bg-white p-4 rounded-xl border ${isDone ? 'border-emerald-300 bg-emerald-50/50' : 'border-slate-200'} flex items-center justify-between cursor-pointer shadow-sm select-none">
            <div class="flex items-center gap-3">
              <input type="checkbox" ${isDone ? 'checked' : ''} readonly class="w-5 h-5 accent-indigo-600 rounded">
              <span class="font-semibold ${isDone ? 'line-through text-slate-400' : 'text-slate-700'}">${task.title}</span>
            </div>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-indigo-700'}">
              +${task.points} pt
            </span>
          </div>
        `;
      }).join('');
    }

    // --- Panel de Administración & Edición Diferida ---
    function toggleAdminModal() {
      const modal = document.getElementById('adminModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderAdminHistoryTasks();
      }
    }

    function renderAdminHistoryTasks() {
      const selectedDate = document.getElementById('adminDatePicker').value;
      const container = document.getElementById('adminHistoryList');
      if (!selectedDate) return;

      const dayLogs = state.logs[selectedDate]?.[currentUser] || {};

      container.innerHTML = state.tasks.map(task => {
        const isDone = !!dayLogs[task.id];
        return `
          <div class="flex items-center justify-between bg-white p-2 rounded border">
            <span class="text-xs font-medium text-slate-700">${task.title}</span>
            <button onclick="adminToggleTask('${task.id}', '${selectedDate}')" class="text-xs px-2 py-1 rounded font-bold ${isDone ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'}">
              ${isDone ? 'Eginda' : 'Egin gabe'}
            </button>
          </div>
        `;
      }).join('');
    }

    function adminToggleTask(taskId, dateKey) {
      if (!state.logs[dateKey]) state.logs[dateKey] = {};
      if (!state.logs[dateKey][currentUser]) state.logs[dateKey][currentUser] = {};

      state.logs[dateKey][currentUser][taskId] = !state.logs[dateKey][currentUser][taskId];
      saveState();
      renderAdminHistoryTasks();
    }

    // --- Copia de Seguridad JSON ---
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `zereginak_backup_${todayStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.users && imported.tasks && imported.logs) {
            state = imported;
            saveState();
            renderUsers();
            alert('Datuak ondo inportatu dira!');
          } else {
            alert('Fitxategiaren formatua ez da baliozkoa.');
          }
        } catch (err) {
          alert('Errorea fitxategia irakurtzean.');
        }
      };
      reader.readAsText(file);
    }

    window.onload = init;
  </script>
</body>
</html>
