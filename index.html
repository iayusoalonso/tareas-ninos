<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zereginak - Gestor de Tareas y Premios</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="container">
        <header class="text-center mb-4">
            <h1 class="fw-bold">🌟 Zereginak</h1>
            <p id="connectionStatus" class="text-muted">🔄 Hodeiarekin konektatzen...</p>
        </header>

        <!-- PANEL DE ADMINISTRACIÓN -->
        <div class="card p-4 mb-4">
            <h3 class="mb-3">🛠️ Panel de Administración</h3>
            
            <!-- Formulario de Tareas -->
            <div class="border p-3 rounded mb-4 bg-white">
                <h5>Nueva Tarea</h5>
                
                <!-- Desplegable de Plantillas -->
                <div class="mb-3">
                    <label for="taskTemplateSelect" class="form-label">📋 Rellenar desde tarea existente:</label>
                    <select id="taskTemplateSelect" class="form-select" onchange="loadTaskTemplate(this.value)">
                        <option value="">-- Seleccionar tarea guardada --</option>
                    </select>
                </div>

                <form id="taskForm" onsubmit="handleAddTask(event)">
                    <div class="mb-3">
                        <label for="taskText" class="form-label">Descripción de la tarea</label>
                        <input type="text" id="taskText" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="taskPoints" class="form-label">Puntos</label>
                            <input type="number" id="taskPoints" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="taskImage" class="form-label">Icono o URL de imagen</label>
                            <input type="text" id="taskImage" class="form-control" placeholder="Ej: 🛏️">
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" id="taskBonus" class="form-check-input">
                        <label for="taskBonus" class="form-check-label">Incluye Bonus</label>
                    </div>
                    <button type="submit" class="btn btn-primary">➕ Añadir Tarea</button>
                </form>
            </div>

            <!-- Listado de Tareas con Ordenación Manual -->
            <div class="mb-4">
                <h5>Gestión y Orden de Tareas</h5>
                <div id="adminTaskList" class="list-group">
                    <!-- Las tareas se renderizan aquí dinámicamente -->
                </div>
            </div>

            <!-- Formulario de Premios -->
            <div class="border p-3 rounded bg-white">
                <h5>Nuevo Premio</h5>
                <form id="rewardForm" onsubmit="handleAddReward(event)">
                    <div class="mb-3">
                        <label for="rewardName" class="form-label">Nombre del Premio</label>
                        <input type="text" id="rewardName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="rewardPoints" class="form-label">Puntos necesarios</label>
                        <input type="number" id="rewardPoints" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success">🎁 Añadir Premio</button>
                </form>
            </div>
        </div>

        <!-- VISTA GENERAL / NIÑOS -->
        <div class="row">
            <div class="col-md-6">
                <div class="card p-3">
                    <h3>📝 Tareas Disponibles</h3>
                    <div id="publicTaskList"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3">
                    <h3>🏆 Premios Disponibles</h3>
                    <div id="publicRewardList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // Configuración de Firebase (Sustituye con tus credenciales de tu proyecto)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "zereginak",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let tasksCache = [];
        let rewardsCache = [];

        // Inicializar datos en tiempo real
        function initApp() {
            const statusEl = document.getElementById('connectionStatus');

            // Escuchar cambios en Tareas
            db.collection('tasks').onSnapshot((snapshot) => {
                tasksCache = [];
                snapshot.forEach((doc) => {
                    tasksCache.push({ id: doc.id, ...doc.data() });
                });

                // Ordenar tareas por el campo 'order', y si coincide por fecha de creación
                tasksCache.sort((a, b) => {
                    const orderA = a.order !== undefined ? a.order : 0;
                    const orderB = b.order !== undefined ? b.order : 0;
                    if (orderA !== orderB) return orderA - orderB;
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                    return timeA - timeB;
                });

                renderTasks();
                updateTaskTemplates(tasksCache);
                statusEl.textContent = "🟢 Konektatuta hodeiarekin";
                statusEl.classList.remove('text-muted');
                statusEl.classList.add('text-success');
            }, (error) => {
                console.error("Error al conectar con Firestore:", error);
                statusEl.textContent = "🔴 Errorea konexioan";
            });

            // Escuchar cambios en Premios
            db.collection('rewards').onSnapshot((snapshot) => {
                rewardsCache = [];
                snapshot.forEach((doc) => {
                    rewardsCache.push({ id: doc.id, ...doc.data() });
                });

                // Ordenar premios: 1º por puntos (ascendente), 2º alfabéticamente
                rewardsCache.sort((a, b) => {
                    if (a.points !== b.points) {
                        return a.points - b.points;
                    }
                    const nameA = (a.name || '').toLowerCase();
                    const nameB = (b.name || '').toLowerCase();
                    return nameA.localeCompare(nameB, 'es', { sensitivity: 'base' });
                });

                renderRewards();
            });
        }

        // Renderizar Tareas
        function renderTasks() {
            const adminList = document.getElementById('adminTaskList');
            const publicList = document.getElementById('publicTaskList');
            
            adminList.innerHTML = '';
            publicList.innerHTML = '';

            tasksCache.forEach((task, index) => {
                // Admin item con controles de ordenación
                adminList.innerHTML += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span>${task.image || '📌'} <strong>${task.text}</strong> (${task.points} pts)</span>
                        </div>
                        <div>
                            <button onclick="moverTarea(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="btn btn-sm btn-outline-secondary me-1">⬆️</button>
                            <button onclick="moverTarea(${index}, 1)" ${index === tasksCache.length - 1 ? 'disabled' : ''} class="btn btn-sm btn-outline-secondary me-1">⬇️</button>
                            <button onclick="deleteTask('${task.id}')" class="btn btn-sm btn-outline-danger">🗑️</button>
                        </div>
                    </div>
                `;

                // Vista pública
                publicList.innerHTML += `
                    <div class="p-2 border-bottom d-flex justify-content-between align-items-center">
                        <span>${task.image || '📌'} ${task.text}</span>
                        <span class="badge bg-primary rounded-pill">+${task.points} pts</span>
                    </div>
                `;
            });
        }

        // Renderizar Premios
        function renderRewards() {
            const publicRewardList = document.getElementById('publicRewardList');
            publicRewardList.innerHTML = '';

            rewardsCache.forEach((reward) => {
                publicRewardList.innerHTML += `
                    <div class="p-2 border-bottom d-flex justify-content-between align-items-center">
                        <span>🎁 ${reward.name}</span>
                        <span class="badge bg-success rounded-pill">${reward.points} pts</span>
                    </div>
                `;
            });
        }

        // Actualizar selector desplegable de plantillas evitando duplicados por texto
        function updateTaskTemplates(tasksList) {
            const select = document.getElementById('taskTemplateSelect');
            if (!select) return;

            select.innerHTML = '<option value="">-- Seleccionar tarea guardada --</option>';

            const uniqueTasks = {};
            tasksList.forEach(t => {
                if (!uniqueTasks[t.text]) {
                    uniqueTasks[t.text] = t;
                }
            });

            Object.values(uniqueTasks).forEach(task => {
                const option = document.createElement('option');
                option.value = JSON.stringify(task);
                option.textContent = `${task.text} — ${task.points} pts`;
                select.appendChild(option);
            });
        }

        // Rellenar formulario automáticamente desde la plantilla seleccionada
        function loadTaskTemplate(jsonString) {
            if (!jsonString) return;
            const task = JSON.parse(jsonString);

            document.getElementById('taskText').value = task.text || '';
            document.getElementById('taskPoints').value = task.points || '';
            document.getElementById('taskImage').value = task.image || '';
            document.getElementById('taskBonus').checked = !!task.bonus;
        }

        // Mover tarea hacia arriba o abajo en el orden manual
        async function moverTarea(index, direccion) {
            const targetIndex = index + direccion;
            if (targetIndex < 0 || targetIndex >= tasksCache.length) return;

            const tareaActual = tasksCache[index];
            const tareaDestino = tasksCache[targetIndex];

            // Asignar nuevos valores de orden
            const newOrderActual = tareaDestino.order !== undefined ? tareaDestino.order : targetIndex;
            const newOrderDestino = tareaActual.order !== undefined ? tareaActual.order : index;

            // Si tenían el mismo orden por defecto, aseguramos valores distintos basados en índices
            const finalOrderA = (newOrderActual === newOrderDestino) ? targetIndex : newOrderActual;
            const finalOrderB = (newOrderActual === newOrderDestino) ? index : newOrderDestino;

            try {
                const batch = db.batch();
                const refActual = db.collection('tasks').doc(tareaActual.id);
                const refDestino = db.collection('tasks').doc(tareaDestino.id);

                batch.update(refActual, { order: finalOrderA });
                batch.update(refDestino, { order: finalOrderB });

                await batch.commit();
            } catch (error) {
                console.error("Error al reordenar la tarea:", error);
            }
        }

        // Añadir Tarea
        async function handleAddTask(e) {
            e.preventDefault();
            const text = document.getElementById('taskText').value;
            const points = parseInt(document.getElementById('taskPoints').value);
            const image = document.getElementById('taskImage').value;
            const bonus = document.getElementById('taskBonus').checked;

            // Asignar un orden superior alfabéticamente/cronológicamente por defecto (al final)
            const maxOrder = tasksCache.length > 0 ? Math.max(...tasksCache.map(t => t.order || 0)) + 1 : 0;

            try {
                await db.collection('tasks').add({
                    text,
                    points,
                    image,
                    bonus,
                    order: maxOrder,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('taskForm').reset();
                document.getElementById('taskTemplateSelect').value = "";
            } catch (error) {
                console.error("Error al añadir tarea:", error);
            }
        }

        // Eliminar Tarea
        async function deleteTask(id) {
            try {
                await db.collection('tasks').doc(id).delete();
            } catch (error) {
                console.error("Error al eliminar tarea:", error);
            }
        }

        // Añadir Premio
        async function handleAddReward(e) {
            e.preventDefault();
            const name = document.getElementById('rewardName').value;
            const points = parseInt(document.getElementById('rewardPoints').value);

            try {
                await db.collection('rewards').add({
                    name,
                    points
                });
                document.getElementById('rewardForm').reset();
            } catch (error) {
                console.error("Error al añadir premio:", error);
            }
        }

        // Arrancar aplicación al cargar la página
        window.onload = initApp;
    </script>
</body>
</html>
