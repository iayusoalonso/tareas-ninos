<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umeen Tasiak - Task Manager</title>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #5C6BC0;
      --dark: #2C3E50;
      --light: #F4F7F6;
      --card-bg: #FFFFFF;
      --accent: #FF7043;
      --disabled: #BDC3C7;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--light);
      color: var(--dark);
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--secondary);
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    /* Tabs de Niños */
    .child-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 8px 16px;
      border: 2px solid var(--primary);
      border-radius: 20px;
      background: white;
      color: var(--primary);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    /* Lista de Tareas */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .task-img {
      width: 55px;
      height: 55px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #eee;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
    }

    .task-title {
      font-weight: bold;
      font-size: 1rem;
      color: var(--dark);
    }

    .task-meta {
      font-size: 0.8rem;
      color: #7F8C8D;
      margin-top: 3px;
    }

    .task-points {
      background: #FFF3E0;
      color: var(--accent);
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    /* Botones de acción */
    .btn-add {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 28px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-title {
      font-size: 1.2rem;
      color: var(--secondary);
      font-weight: bold;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--secondary);
    }

    .form-input, .form-select {
      padding: 10px;
      border: 1px solid #DDD;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .checkbox-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #E0E0E0; color: var(--dark); }
    .btn-danger { background: #E74C3C; color: white; margin-right: auto; }
  </style>
</head>
<body>

  <header>
    <h1>Umeen Tasiak</h1>
    <div class="child-tabs" id="child-tabs"></div>
  </header>

  <main class="task-list" id="task-list-container"></main>

  <button class="btn-add" onclick="openTaskModal()">+</button>

  <!-- MODAL DE TAREA -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <div class="modal-title" id="modal-title-text">Tarea berria / Editatu</div>

      <input type="hidden" id="t-id">

      <div class="form-group">
        <label for="t-name">Izena (Nombre):</label>
        <input type="text" id="t-name" class="form-input" placeholder="Ej: Hortzak garbitu">
      </div>

      <div class="form-group">
        <label for="t-category">Kategoria (Categoría):</label>
        <input type="text" id="t-category" class="form-input" placeholder="Ej: Higiene">
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex:1;">
          <label for="t-points">Puntuak (Puntos):</label>
          <input type="number" id="t-points" class="form-input" value="10">
        </div>
        <div class="form-group" style="flex:1;">
          <label for="t-checks">Txekeak (Checks):</label>
          <input type="number" id="t-checks" class="form-input" value="1">
        </div>
      </div>

      <div class="form-group">
        <label for="t-schedule">Maiztasuna (Horario):</label>
        <select id="t-schedule" class="form-select">
          <option value="all">Egunero (Todos los días)</option>
          <option value="weekdays">Eskola Egunak (Entre semana)</option>
          <option value="weekend">Asteburua (Fin de semana)</option>
          <option value="special">Egun Bereziak (Días especiales)</option>
        </select>
      </div>

      <!-- ASIGNACIÓN DE NIÑOS -->
      <div class="form-group">
        <label>Nori dagokio? (Asignar a):</label>
        <div class="checkbox-group" id="t-assigned-children-container"></div>
      </div>

      <!-- FECHA DE ACTIVACIÓN Y ESTADO -->
      <div class="form-group">
        <label for="t-active-from">Aktibazio data (Activar desde - Opcional):</label>
        <input type="date" id="t-active-from" class="form-input">
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
        <input type="checkbox" id="t-disabled" style="width:20px; height:20px; cursor:pointer;">
        <label for="t-disabled" style="cursor:pointer; font-size: 0.95rem;">Desaktibatuta (Desactivar tarea)</label>
      </div>

      <div class="form-group">
        <label for="t-image">Irudia / Foto (Base64 edo URL):</label>
        <input type="file" id="t-file-input" accept="image/*" class="form-input" onchange="handleImageUpload(event)">
        <input type="hidden" id="t-image">
        <img id="t-preview-img" style="max-height: 80px; width: auto; object-fit: contain; margin-top: 5px; display: none; border-radius: 6px;">
      </div>

      <div class="modal-actions">
        <button class="btn btn-danger" id="btn-delete-task" onclick="deleteTask()" style="display:none;">Ezabatu</button>
        <button class="btn btn-secondary" onclick="closeTaskModal()">Utzi</button>
        <button class="btn btn-primary" onclick="saveTask()">Gorde</button>
      </div>
    </div>
  </div>

  <script>
    // Objeto global de datos
    let cloudData = JSON.parse(localStorage.getItem('cloudData')) || {
      children: ["Luke", "Marty"],
      isSpecialDayActive: false,
      // Formato antiguo guardado provisionalmente si existe:
      tasksConfig: {
        "Luke": [
          { id: "t1", name: "Hortzak garbitu", category: "Higiene", points: 10, checks: 1, schedule: "all", image: "" }
        ],
        "Marty": [
          { id: "t1", name: "Hortzak garbitu", category: "Higiene", points: 10, checks: 1, schedule: "all", image: "" }
        ]
      }
    };

    let currentChild = cloudData.children[0] || "Luke";

    // 1. SCRIPT DE MIGRACIÓN AUTOMÁTICA (CONSERVA TAREAS Y FOTOS)
    function migrateExistingTasks() {
      if (!cloudData.globalTasks) {
        const globalTasksMap = new Map();

        if (cloudData.tasksConfig) {
          Object.entries(cloudData.tasksConfig).forEach(([childName, tasks]) => {
            tasks.forEach(task => {
              const key = task.id || task.name;
              if (globalTasksMap.has(key)) {
                const existingTask = globalTasksMap.get(key);
                if (!existingTask.assignedChildren.includes(childName)) {
                  existingTask.assignedChildren.push(childName);
                }
              } else {
                globalTasksMap.set(key, {
                  ...task,
                  id: task.id || "task_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
                  assignedChildren: [childName],
                  activeFrom: task.activeFrom || null,
                  activeUntil: task.activeUntil || null,
                  disabled: task.disabled || false
                });
              }
            });
          });
        }

        cloudData.globalTasks = Array.from(globalTasksMap.values());
        saveCloudData();
      }
    }

    function saveCloudData() {
      localStorage.setItem('cloudData', JSON.stringify(cloudData));
    }

    // 2. RENDERING DE INTERFAZ
    function initApp() {
      migrateExistingTasks();
      renderChildrenTabs();
      renderTasks();
    }

    function renderChildrenTabs() {
      const container = document.getElementById('child-tabs');
      container.innerHTML = '';
      cloudData.children.forEach(child => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${child === currentChild ? 'active' : ''}`;
        btn.innerText = child;
        btn.onclick = () => {
          currentChild = child;
          renderChildrenTabs();
          renderTasks();
        };
        container.appendChild(btn);
      });
    }

    function isTaskActiveForChildAndDate(task, childName, targetDate = new Date()) {
      if (task.disabled) return false;
      if (task.assignedChildren && !task.assignedChildren.includes(childName)) return false;

      const todayStr = targetDate.toISOString().split('T')[0];
      if (task.activeFrom && todayStr < task.activeFrom) return false;
      if (task.activeUntil && todayStr > task.activeUntil) return false;

      const dayIndex = (targetDate.getDay() + 6) % 7;
      const isWeekend = dayIndex === 5 || dayIndex === 6;

      if (task.schedule === 'weekdays' && isWeekend) return false;
      if (task.schedule === 'weekend' && !isWeekend) return false;
      if (task.schedule === 'special' && !cloudData.isSpecialDayActive) return false;

      return true;
    }

    function renderTasks() {
      const container = document.getElementById('task-list-container');
      container.innerHTML = '';

      const activeTasks = cloudData.globalTasks.filter(t => isTaskActiveForChildAndDate(t, currentChild));

      if (activeTasks.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 20px; color: #95A5A6;">Ez dago tasiarik egunean.</div>`;
        return;
      }

      activeTasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.onclick = () => openTaskModal(task.id);

        const img = task.image ? `<img src="${task.image}" class="task-img">` : `<div class="task-img"></div>`;

        card.innerHTML = `
          ${img}
          <div class="task-info">
            <div class="task-title">${task.name}</div>
            <div class="task-meta">${task.category} • ${task.schedule}</div>
          </div>
          <div class="task-points">+${task.points} pt</div>
        `;
        container.appendChild(card);
      });
    }

    // 3. GESTIÓN DEL MODAL Y FORMULARIO
    function openTaskModal(taskId = null) {
      const modal = document.getElementById('task-modal');
      const childrenContainer = document.getElementById('t-assigned-children-container');
      
      // Cargar checkboxes de niños
      childrenContainer.innerHTML = '';
      cloudData.children.forEach(child => {
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        label.innerHTML = `
          <input type="checkbox" value="${child}" class="child-checkbox"> ${child}
        `;
        childrenContainer.appendChild(label);
      });

      if (taskId) {
        const task = cloudData.globalTasks.find(t => t.id === taskId);
        if (!task) return;

        document.getElementById('modal-title-text').innerText = "Editatu Tasia";
        document.getElementById('t-id').value = task.id;
        document.getElementById('t-name').value = task.name;
        document.getElementById('t-category').value = task.category;
        document.getElementById('t-points').value = task.points;
        document.getElementById('t-checks').value = task.checks || 1;
        document.getElementById('t-schedule').value = task.schedule;
        document.getElementById('t-active-from').value = task.activeFrom || '';
        document.getElementById('t-disabled').checked = !!task.disabled;
        document.getElementById('t-image').value = task.image || '';

        // Marcar checkboxes asignados
        document.querySelectorAll('.child-checkbox').forEach(cb => {
          cb.checked = task.assignedChildren && task.assignedChildren.includes(cb.value);
        });

        // Vista previa de imagen
        const preview = document.getElementById('t-preview-img');
        if (task.image) {
          preview.src = task.image;
          preview.style.display = 'block';
        } else {
          preview.style.display = 'none';
        }

        document.getElementById('btn-delete-task').style.display = 'block';
      } else {
        document.getElementById('modal-title-text').innerText = "Tarea Berria";
        document.getElementById('t-id').value = '';
        document.getElementById('t-name').value = '';
        document.getElementById('t-category').value = '';
        document.getElementById('t-points').value = 10;
        document.getElementById('t-checks').value = 1;
        document.getElementById('t-schedule').value = 'all';
        document.getElementById('t-active-from').value = '';
        document.getElementById('t-disabled').checked = false;
        document.getElementById('t-image').value = '';
        document.getElementById('t-preview-img').style.display = 'none';

        // Por defecto marcar el niño actual
        document.querySelectorAll('.child-checkbox').forEach(cb => {
          cb.checked = (cb.value === currentChild);
        });

        document.getElementById('btn-delete-task').style.display = 'none';
      }

      modal.classList.add('active');
    }

    function closeTaskModal() {
      document.getElementById('task-modal').classList.remove('active');
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('t-image').value = e.target.result;
        const preview = document.getElementById('t-preview-img');
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function saveTask() {
      const id = document.getElementById('t-id').value || "task_" + Date.now();
      const name = document.getElementById('t-name').value.trim();
      const category = document.getElementById('t-category').value.trim();
      const points = parseInt(document.getElementById('t-points').value) || 0;
      const checks = parseInt(document.getElementById('t-checks').value) || 1;
      const schedule = document.getElementById('t-schedule').value;
      const activeFrom = document.getElementById('t-active-from').value || null;
      const disabled = document.getElementById('t-disabled').checked;
      const image = document.getElementById('t-image').value;

      const assignedChildren = Array.from(document.querySelectorAll('.child-checkbox:checked')).map(cb => cb.value);

      if (!name) {
        alert("Sartu tasiaren izena, mesedez.");
        return;
      }

      const taskData = {
        id,
        name,
        category,
        points,
        checks,
        schedule,
        assignedChildren,
        activeFrom,
        activeUntil: null,
        disabled,
        image
      };

      const existingIndex = cloudData.globalTasks.findIndex(t => t.id === id);
      if (existingIndex >= 0) {
        cloudData.globalTasks[existingIndex] = taskData;
      } else {
        cloudData.globalTasks.push(taskData);
      }

      saveCloudData();
      closeTaskModal();
      renderTasks();
    }

    function deleteTask() {
      const id = document.getElementById('t-id').value;
      if (!id) return;

      if (confirm("Ziur zaude tasia hau ezabatu nahi duzula?")) {
        cloudData.globalTasks = cloudData.globalTasks.filter(t => t.id !== id);
        saveCloudData();
        closeTaskModal();
        renderTasks();
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
